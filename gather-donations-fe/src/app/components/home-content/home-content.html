<div class="home-content">
  <div class="home-main">
    <app-search-bar (search)="onSearch($event)" />
    <app-categories-grid [selectedCategory]="selectedCategory" (categoryChange)="onCategoryChange($event)" />
    @if (isLoading) {
      <p class="loading-state">Loading donations…</p>
    } @else {
      <app-donations-grid [donations]="donations" [isLoading]="isLoading" (viewDetails)="onViewDetails($event)" />
    }
  </div>
  <app-right-panel />
</div>

<app-donation-detail-modal [donation]="selectedDonation" (close)="onCloseModal()" />
