<div class="login-page">
  <div class="login-card">
    <div class="logo-box">Benevo</div>
    <h2>Welcome Back</h2>

    <form (submit)="$event.preventDefault()">
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" name="email" [(ngModel)]="email" class="custom-input" />
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" [(ngModel)]="password" class="custom-input" />
      </div>

      @if (errorMessage()) {
        <div class="error-message">{{ errorMessage() }}</div>
      }

      <div class="action-buttons">
        <button type="button" class="btn-primary" (click)="handleLogin()" [disabled]="isLoading()">
          {{ isLoading() ? 'Logging in…' : 'Login' }}
        </button>
      </div>
    </form>
    <div class="forgot-pass">Forgot Password?</div>
    <div class="divider"><span>or</span></div>

    <button class="btn-guest" (click)="handleGuestLogin()">Continue as Guest</button>

    <div class="login-footer">
      <p>Don't have an account? <a routerLink="/signup">Sign up</a></p>
    </div>
  </div>
</div>
