<div class="shell">
  <header class="topbar">
    <div class="left-info" routerLink="/home">
      <img class="main-icon" src="favicon.ico" routerLink="/home" />
      <div class="logo">Benevo</div>
    </div>
    <div class="user-info">
      <span class="username">{{ displayName() }}</span>
      <img class="avatar" [src]="avatarUrl()" alt="avatar" routerLink="/profile" />
    </div>
  </header>

  <div class="body">
    <nav class="sidebar">
      <a routerLink="/home" routerLinkActive="active"> Home </a>
      <a routerLink="/post-donations" routerLinkActive="active"> Post Donations </a>
      <a routerLink="/request-donations" routerLinkActive="active"> Request Donations </a>
      <a routerLink="/volunteer" routerLinkActive="active"> Volunteer </a>
      <a routerLink="/active-requests" routerLinkActive="active"> Active Requests </a>

      <div class="sidebar-bottom">
        <a routerLink="/profile" routerLinkActive="active"> Profile</a>
        <a routerLink="/settings" routerLinkActive="active"> Settings </a>
        <a href="#" (click)="$event.preventDefault(); logout()"> Log out </a>
      </div>
    </nav>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
