<div class="edit-profile-page">
    <div class="profile-form">
        <div class="pfp-upload">
            <div class="img-container">
                <img class="profile-picture" [src]="avatarUrl()" alt="avatar"/>
            </div>
            <input #fileInput type="file" accept="image/*" class="hidden-file-input" (change)="onFileSelected($event)" />
            <button class="upload-btn" type="button" (click)="triggerFileInput()">Choose Photo</button>
        </div>

        <div class="form-wrapper">
            <!-- edit profile form -->
            <div class="form-section">
                <h2>User Profile</h2>
                <div class="form-group">
                    <label class="form-label">First Name</label>
                    <input id="first-name" type="text" class="form-input" placeholder="{{ displayFirstName() }}"/>
                </div>
                <div class="form-group">
                    <label class="form-label">Last Name</label>
                    <input id="last-name" type="text" class="form-input" placeholder="{{ displayLastName() }}"/>
                </div>
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input id="username" type="text" class="form-input" placeholder="{{ displayUsername() }}"/>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input id="email" type="text" class="form-input" placeholder="{{ displayEmail() }}"/>
                </div>
            </div>
                
            <div class="form-section">
                <h2>Change Password</h2>
                <div class="form-group">
                    <label class="form-label">Current Password</label>
                    <input id="password" type="text" class="form-input" placeholder=""/>
                </div>
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input id="new-password" type="text" class="form-input" placeholder=""/>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm New Password</label>
                    <input id="confirm-new-pass" type="text" class="form-input" placeholder=""/>
                </div>
            </div>
        </div>
    </div>

    <div class="form-footer">
        <button class="submit-btn" routerLink="/profile">Submit</button>
        <button class="cancel-btn" routerLink="/profile">Cancel</button>
    </div>
    <p class="the-curse" style="color: transparent">This class has killed my soul and my whimsy</p>
</div>
